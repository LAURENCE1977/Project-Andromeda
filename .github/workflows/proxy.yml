name: Andromeda Proxy
on:
  repository_dispatch:
    types: [andromeda_chat]
  workflow_dispatch:
jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call OpenRouter
        id: call
        env:
          OR_KEY: ${{ secrets.OPENROUTER_KEY }}
          INPUT: ${{ github.client_payload.input }}
        run: |
          RESPONSE=$(curl -s -X POST https://openrouter.ai/api/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OR_KEY" \
            -H "HTTP-Referer: https://1977.github.io/Project-Andromeda/" \
            -H "X-Title: Project Andromeda" \
            -d '{
              "model": "meta-llama/llama-3.1-8b-instruct:free",
              "messages": [{"role": "user", "content": "'"${INPUT//\"/\\\"}"'"}]
            }')
          echo "RESPONSE=$RESPONSE" >> $GITHUB_OUTPUT
      - name: Deliver Result
        run: |
          echo '${{ steps.call.outputs.RESPONSE }}' > response.json
