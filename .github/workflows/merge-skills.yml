name: Merge Skills into all-skills

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create all-skills folder
        run: mkdir -p all-skills

      - name: Clone core-skills
        run: |
          rm -rf all-skills/core-skills
          git clone --depth 1 https://github.com/charlieautomatesskills/charlieautomatesskills.git all-skills/core-skills || true

      - name: Clone openclaw
        run: |
          rm -rf all-skills/openclaw
          git clone --depth 1 https://github.com/openclaw/openclaw.git all-skills/openclaw || true

      - name: Clone godmode
        run: |
          rm -rf all-skills/godmode
          git clone --depth 1 https://github.com/elder-plinius/G0DM0D3.git all-skills/godmode || true

      - name: Clone auto-browser
        run: |
          rm -rf all-skills/auto-browser
          git clone --depth 1 https://github.com/andrewyng/auto-browser.git all-skills/auto-browser || true

      - name: Remove placeholder
        run: rm -f all-skills/PLACEHOLDER.txt

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all-skills/
          git commit -m "Merge: core-skills, openclaw, godmode, auto-browser" || echo "No changes"
          git push
