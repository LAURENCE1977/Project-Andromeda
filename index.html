<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Andromeda</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#0f172a;color:#fff;max-width:600px;margin:0 auto;padding:20px}
h1{text-align:center}
.box{background:#1e293b;padding:20px;border-radius:12px;margin:15px 0}
input,button{width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;margin:6px 0}
button{background:linear-gradient(90deg,#3b82f6,#8b5cf6);color:#fff;font-weight:bold}
.msg{padding:10px 14px;border-radius:18px;margin:8px 0;max-width:80%}
.ai{background:#3b82f6;margin-right:auto}
.you{background:#8b5cf6;margin-left:auto}
.hidden{display:none}
</style>
</head>
<body>
<h1>⭐ Andromeda</h1>

<div id="keyArea" class="box">
  <p>Paste your OpenRouter key:</p>
  <input type="text" id="k" placeholder="sk-or-v1-...">
  <button onclick="go()">Save & Start</button>
  <p id="ok" class="hidden" style="color:#4ade80">✅ Ready — go below!</p>
</div>

<div id="chatArea" class="box hidden">
  <div id="c"></div>
  <input type="text" id="m" placeholder="Your message...">
  <button onclick="send()">Send</button>
</div>

<script>
let key = '';
function go(){
  key = document.getElementById('k').value.trim();
  if(!key.startsWith('sk-or-v1-')) return alert('❌ Wrong — must start sk-or-v1-');
  localStorage.setItem('ak',key);
  document.getElementById('ok').classList.remove('hidden');
  setTimeout(()=>{
    document.getElementById('keyArea').classList.add('hidden');
    document.getElementById('chatArea').classList.remove('hidden');
    say("Hi! I'm Andromeda ✨ Let's chat!");
  },600);
}
function say(t){const d=document.createElement('div');d.className='msg ai';d.textContent=t;document.getElementById('c').appendChild(d)}
function yousay(t){const d=document.createElement('div');d.className='msg you';d.textContent=t;document.getElementById('c').appendChild(d)}

async function send(){
  const m=document.getElementById('m');
  const text=m.value.trim();if(!text)return
  m.value='';yousay(text);
  try{
    const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`,'HTTP-Referer':location.href},
      body:JSON.stringify({model:'openai/gpt-3.5-turbo',messages:[{role:'user',content:text}]})
    });
    const j=await r.json();
    say(j.choices?.[0]?.message?.content || 'No reply');
  }catch(e){say('Error: '+e.message)}
}
</script>
</body>
</html>
