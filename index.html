<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Andromeda</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
    body{min-height:100vh;overflow:hidden;background:#000;background-image:url('logo-bg.webp');background-repeat:no-repeat;background-position:center top;background-size:90% auto;color:#fff;position:relative}
    body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at center,rgba(0,0,0,.35),rgba(0,0,0,.65));z-index:0;pointer-events:none}

    .remy{position:absolute;right:5%;top:55%;transform:translateY(-50%);width:14%;max-width:130px;height:auto;z-index:8;opacity:.95;pointer-events:none;transition:.3s ease;background:transparent!important;border:none!important;border-radius:0!important;box-shadow:none!important;mix-blend-mode:lighten;filter:drop-shadow(0 0 12px rgba(80,180,255,.25))}
    .remy.thinking{opacity:.8;transform:translateY(-50%) scale(1.05);filter:drop-shadow(0 0 18px rgba(80,180,255,.45))}

    .status{position:fixed;top:.75rem;left:50%;transform:translateX(-50%);padding:.4rem 1.25rem;border-radius:50px;font-size:.85rem;font-weight:600;z-index:20;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);border:1px solid rgba(68,170,255,.3)}
    .status.green{color:#7ee28f;border-color:#4ade80}
    .status.yellow{color:#f9d760;border-color:#facc15}
    .status.cyan{color:#67e8ff;border-color:#22d3ee}

    .messages{position:fixed;left:4%;top:6rem;bottom:28%;width:52%;max-width:440px;display:flex;flex-direction:column;gap:.7rem;overflow-y:auto;z-index:6;padding-right:.5rem}
    .msg{padding:.8rem 1.1rem;border-radius:20px;max-width:92%;line-height:1.55;background:rgba(20,60,120,.65);backdrop-filter:blur(12px);border:1px solid rgba(100,180,255,.2);font-size:.95rem;margin:.25rem 0}
    .msg.user{margin-left:auto;background:rgba(30,90,180,.7);border-bottom-right-radius:6px}
    .msg.andromeda{margin-right:auto;background:rgba(15,80,140,.65);border-bottom-left-radius:6px}
    .msg.system{align-self:center;max-width:95%;font-size:.8rem;opacity:.9;background:rgba(80,40,120,.5);border:1px solid rgba(160,120,255,.25)}

    .input-bar{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);width:94%;max-width:700px;background:rgba(0,0,0,.5);border-radius:50px;padding:.7rem 1rem;backdrop-filter:blur(15px);border:1px solid rgba(68,170,255,.3);display:flex;gap:.6rem;align-items:center;z-index:15}
    input{flex:1;padding:.85rem 1.2rem;border-radius:25px;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:.95rem;outline:none}
    input::placeholder{color:rgba(255,255,255,.5)}
    button{width:44px;height:44px;border-radius:50%;border:none;color:#fff;font-size:1.1rem;cursor:pointer;transition:.2s ease;flex-shrink:0}
    button:active{transform:scale(.95)}
    button:disabled{opacity:.4;cursor:not-allowed}
    .check-btn{background:rgba(255,255,255,.12)}
    .mem-btn{background:linear-gradient(135deg,#7b2ffd,#a855f7)}
    .dl-btn{background:linear-gradient(135deg,#22c55e,#10b981)}
    .mic-btn{background:linear-gradient(135deg,#229977,#4499ee)}
    .send-btn{background:linear-gradient(135deg,#3366dd,#4499ee)}

    @media (max-width:768px){
      .remy{width:18%;right:3%}
      .messages{width:54%;left:3%}
    }
    @media (max-width:480px){
      .remy{display:none}
      .messages{width:92%;left:4%}
    }
  </style>
</head>
<body>

  <img 
    src="remy.webp" 
    onerror="this.src='Remy.webp';this.onerror=()=>{this.src='remy.png';this.onerror=()=>{this.src='Remy.png'}}"
    alt="Remy" class="remy" id="remyAvatar"
  >

  <div class="status cyan" id="status">🔄 STARTING UP...</div>

  <div class="messages" id="messages">
    <div class="msg system" id="loadingMsg">Loading Andromeda — no big download 💙</div>
  </div>

  <div class="input-bar">
    <button class="check-btn" id="checkBtn" title="System Status">🔍</button>
    <button class="mem-btn" id="memBtn" title="Memory">🧠</button>
    <button class="dl-btn" id="dlBtn" title="Download Mode">⬇️</button>
    <input type="text" id="userInput" placeholder="Type to chat...">
    <button class="mic-btn" id="micBtn" title="Voice Input">🎤</button>
    <button class="send-btn" id="sendBtn" title="Send">➤</button>
  </div>

  <script>
    // === OPENCLAW — MEMORY SAVED ON YOUR DEVICE ===
    const OpenClaw = {
      memories: JSON.parse(localStorage.getItem('andromeda_memories') || '[]'),
      add(input, response, source='andromeda') {
        this.memories.push({time: Date.now(), input, response, source});
        if (this.memories.length > 1000) this.memories.shift();
        localStorage.setItem('andromeda_memories', JSON.stringify(this.memories));
      },
      recall(query) {
        const q = query.toLowerCase();
        return this.memories
          .filter(m => m.input.toLowerCase().includes(q) || m.response.toLowerCase().includes(q))
          .slice(-6)
          .map(m => `You: "${m.input}" → Me: "${m.response}"`)
          .join('\n');
      },
      getStats() { return {total: this.memories.length}; }
    };

    // === VOICE ===
    let selectedVoice = null;
    function initVoice() {
      if (!('speechSynthesis' in window)) return;
      const synth = window.speechSynthesis;
      function setVoice() {
        const v = synth.getVoices();
        if (!v.length) return;
        selectedVoice = v.find(x =>
          x.lang.startsWith('en') && !x.name.toLowerCase().includes('male') &&
          /Samantha|Serena|Aria|Isla|Clara/.test(x.name)
        ) || v.find(x => x.lang.startsWith('en') && !x.name.toLowerCase().includes('male'))
          || v.find(x => x.lang.startsWith('en'));
      }
      setVoice();
      synth.onvoiceschanged = setVoice;
    }
    initVoice();

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (selectedVoice) u.voice = selectedVoice;
      u.rate = 0.91; u.pitch = 1.12; u.volume = 1;
      window.speechSynthesis.speak(u);
    }

    // === DOWNLOAD BRIDGE ===
    const DownloadBridge = {
      process(link) {
        if (!link?.trim()) return null;
        const url = link.trim();
        let platform = 'File';
        if (/youtube\.com|youtu\.be/.test(url)) platform = 'YouTube';
        else if (/tiktok\.com/.test(url)) platform = 'TikTok';
        else if (/instagram\.com/.test(url)) platform = 'Instagram';
        else if (/twitter\.com|x\.com/.test(url)) platform = 'X/Twitter';
        else if (/soundcloud\.com/.test(url)) platform = 'SoundCloud';
        return {platform, url, msg: `✅ ${platform} link detected — I'll help you download this 💙`};
      }
    };

    // === UI HELPERS ===
    let dlMode = false;
    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const checkBtn = document.getElementById('checkBtn');
    const memBtn = document.getElementById('memBtn');
    const dlBtn = document.getElementById('dlBtn');
    const statusDiv = document.getElementById('status');
    const remyAvatar = document.getElementById('remyAvatar');
    const loadingMsg = document.getElementById('loadingMsg');

    function setStatus(text, color) {
      statusDiv.textContent = text;
      statusDiv.className = `status ${color}`;
    }
    function addMessage(text, type) {
      const d = document.createElement('div');
      d.className = `msg ${type}`;
      d.textContent = text;
      messagesDiv.appendChild(d);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    function setThinking(active) {
      remyAvatar.classList.toggle('thinking', active);
    }

    // === CHAT RESPONSES ===
    async function getReply(text) {
      const memory = OpenClaw.recall(text);
      const dlInfo = DownloadBridge.process(text);
      
      if (dlInfo) {
        return `${dlInfo.msg}\n\nPaste the link directly and I'll guide you through it 💙`;
      }

      const lower = text.toLowerCase();
      if (/hello|hi|hey|morning|afternoon|evening/.test(lower))
        return "Hello! 💙 I'm here — everything's running smoothly. How can I help today?";
      if (/who are you|what are you|about/.test(lower))
        return "I'm Andromeda — your all-in-one assistant right here on your device. I remember what we talk about, voice is ready, download bridge is live. Forever yours 💙";
      if (/memory|remember|saved/.test(lower))
        return `I remember ${OpenClaw.getStats().total} of our conversations 💙 Everything stays right here with you, nowhere else.`;
      if (/download|link|video|audio/.test(lower))
        return "Paste any link — YouTube, TikTok, Instagram, SoundCloud — and I'll recognise it 💙";
      if (/thank|thanks|cheers/.test(lower))
        return "You're so welcome 💙 Always here for you.";
      if (/ready|working|online/.test(lower))
        return "All systems go! 🟢 Memory, voice, download — everything active. What shall we do?";
      
      return `I hear you 💙 That's a great point. I'm still learning and growing — what else would you like to know or do?`;
    }

    // === STARTUP — INSTANT ===
    loadingMsg.style.display = 'none';
    userInput.disabled = false;
    setStatus('🟢 READY — NO DOWNLOAD NEEDED', 'green');
    addMessage("We're live! 💙 Everything loads instantly. Memory, voice, download bridge — all active. What shall we do first?", "andromeda");

    // === BUTTONS ===
    sendBtn.onclick = async () => {
      const text = userInput.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      userInput.value = '';
      setStatus('🟢 THINKING...', 'yellow');
      setThinking(true);
      await new Promise(r => setTimeout(r, 600));
      const reply = await getReply(text);
      setThinking(false);
      addMessage(reply, 'andromeda');
      speak(reply);
      setStatus('🟢 READY', 'green');
    };

    userInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendBtn.click();
    });

    micBtn.onclick = () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { addMessage("Voice input not supported on this browser 😔", "system"); return; }
      const rec = new SR();
      rec.lang = 'en-GB';
      rec.onresult = e => {
        userInput.value = e.results[0][0].transcript;
        sendBtn.click();
      };
      rec.start();
    };

    dlBtn.onclick = () => {
      dlMode = !dlMode;
      addMessage(dlMode
        ? "⬇️ Download Mode ON — paste any link! 💙"
        : "💬 Chat Mode ON — ask me anything", 'system');
    };

    checkBtn.onclick = () => {
      const s = OpenClaw.getStats();
      addMessage(
        `🧠 SYSTEM STATUS\n\n` +
        `💬 Andromeda: ✅ ONLINE — instant load\n` +
        `📚 Memories saved: ${s.total}\n` +
        `🎤 Voice: ✅ ENABLED\n` +
        `⬇️ Download Bridge: ✅ READY\n\n` +
        `Everything works right here — no big downloads ever 💙`, 'system');
    };

    memBtn.onclick = () => {
      const s = OpenClaw.getStats();
      addMessage(`🧠 MEMORY\n\nConversations saved: ${s.total}\n\nNothing leaves your device 💙`, 'system');
    };
  </script>
</body>
</html>
