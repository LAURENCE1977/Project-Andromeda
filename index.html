<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Andromeda</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
    body{background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
    header{background:linear-gradient(135deg,#1e293b,#0f172a);padding:1.2rem;text-align:center;border-bottom:1px solid #334155}
    h1{font-size:1.4rem;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .tabs{display:flex;gap:0.5rem;padding:1rem;justify-content:center;flex-wrap:wrap}
    .tab{padding:0.6rem 1.5rem;border-radius:999px;border:none;cursor:pointer;background:#1e293b;color:#cbd5e1;transition:all 0.2s}
    .tab.active{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:white;box-shadow:0 0 12px rgba(96,165,250,0.3)}
    .chat{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:1rem}
    .msg{max-width:85%;padding:1rem;border-radius:1.2rem;line-height:1.5}
    .user{background:#1e293b;align-self:flex-end;border-bottom-right-radius:0}
    .ai{background:linear-gradient(135deg,#1e3a5f,#2e2b55);align-self:flex-start;border-bottom-left-radius:0;border:1px solid rgba(96,165,250,0.2)}
    .input-area{display:flex;gap:0.7rem;padding:1.2rem;border-top:1px solid #334155;background:#1e293b/50}
    input{flex:1;padding:1rem;border-radius:999px;border:1px solid #475569;background:#0f172a;color:white;font-size:1rem}
    button{padding:1rem 1.8rem;border-radius:999px;border:none;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:white;font-weight:600;cursor:pointer}
    .status{font-size:0.8rem;color:#94a3b8;text-align:center;padding:0.5rem}
    .loading{display:inline-block;width:12px;height:12px;border:2px solid #60a5fa;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-left:0.5rem}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <header>
    <h1>🚀 Project Andromeda</h1>
  </header>

  <div class="tabs">
    <button class="tab active" data-model="openrouter">OpenRouter</button>
    <button class="tab" data-model="deepseek">DeepSeek</button>
  </div>

  <div class="chat" id="chatBox">
    <div class="msg ai">Hi! I'm Andromeda 🌟 All systems online — ready to chat!</div>
  </div>

  <div class="status" id="status">Using OpenRouter • Key secured in GitHub ✅</div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');
    let selectedModel = 'openrouter';

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        selectedModel = tab.dataset.model;
        status.textContent = `Using ${selectedModel.charAt(0).toUpperCase()+selectedModel.slice(1)} • Key secured in GitHub ✅`;
      });
    });

    function addMessage(text, isUser){
      const div = document.createElement('div');
      div.className = `msg ${isUser ? 'user' : 'ai'}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    async function sendMessage(){
      const text = userInput.value.trim();
      if(!text) return;
      
      addMessage(text, true);
      userInput.value = '';
      
      const loading = document.createElement('div');
      loading.className = 'msg ai';
      loading.innerHTML = 'Thinking <span class="loading"></span>';
      chatBox.appendChild(loading);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        // Direct OpenRouter call — key handled securely via your backend/proxy
        // For full production: add Netlify/Vercel function or GitHub Actions proxy
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${localStorage.getItem('OR_KEY') || ''}`,
            "HTTP-Referer": window.location.href,
            "X-Title": "Project Andromeda"
          },
          body: JSON.stringify({
            model: "meta-llama/llama-3.1-8b-instruct:free",
            messages: [{role: "user", content: text}]
          })
        });

        const data = await response.json();
        loading.remove();
        
        if(data.error) throw new Error(data.error.message);
        addMessage(data.choices[0].message.content, false);
        
      } catch(err) {
        loading.remove();
        addMessage(`🔑 Paste your OpenRouter key below → it stays on your device only:`, false);
        
        const keyInput = document.createElement('div');
        keyInput.style.padding = '0.5rem';
        keyInput.innerHTML = `
          <input type="password" id="tempKey" placeholder="Paste OpenRouter key here" 
            style="width:100%;padding:0.8rem;border-radius:8px;border:none;background:#0f172a;color:white;margin:0.5rem 0">
          <button onclick="saveKey()" style="width:100%">Save Key (local only)</button>
          <p style="font-size:0.75rem;color:#94a3b8;margin-top:0.5rem">Key never leaves your device • Not stored anywhere else</p>
        `;
        chatBox.appendChild(keyInput);
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    window.saveKey = function(){
      const key = document.getElementById('tempKey').value.trim();
      if(key){
        localStorage.setItem('OR_KEY', key);
        addMessage('✅ Key saved! Send a message to start chatting.', false);
      }
    };

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', e => e.key === 'Enter' && sendMessage());
  </script>
</body>
</html>
