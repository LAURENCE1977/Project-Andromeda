<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a1a">
  <title>Project Andromeda</title>
  <style>
    :root {
      --bg: #050510;
      --accent: #6366f1;
      --accent-soft: rgba(99,102,241,0.15);
      --text: #e5e7eb;
      --subtext: #9ca3af;
      --user-msg: #1e293b;
      --ai-msg: #111827;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid rgba(99,102,241,0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .status {
      font-size: 0.85rem;
      color: #22c55e;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .status-dot {
      width: 8px; height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .avatar-container {
      display: flex;
      justify-content: center;
      padding: 1rem;
    }
    .remy-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      box-shadow: 0 0 30px rgba(99,102,241,0.3);
    }
    .message {
      max-width: 85%;
      padding: 0.9rem 1.1rem;
      border-radius: 1.1rem;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity:0; transform: translateY(8px); }
      to { opacity:1; transform: translateY(0); }
    }
    .user {
      background: var(--user-msg);
      margin-left: auto;
      border-bottom-right-radius: 0.3rem;
    }
    .ai {
      background: var(--ai-msg);
      margin-right: auto;
      border-bottom-left-radius: 0.3rem;
      border-left: 2px solid var(--accent);
    }
    .system {
      align-self: center;
      background: var(--accent-soft);
      color: #a5b4fc;
      font-size: 0.9rem;
      padding: 0.6rem 1rem;
      border-radius: 0.8rem;
    }
    .input-area {
      padding: 1rem 1.25rem;
      border-top: 1px solid rgba(99,102,241,0.2);
      display: flex;
      gap: 0.7rem;
      align-items: center;
    }
    textarea {
      flex: 1;
      background: rgba(30,41,59,0.6);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 1rem;
      padding: 0.9rem 1.1rem;
      color: white;
      font-size: 1rem;
      resize: none;
      min-height: 52px;
      max-height: 120px;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(99,102,241,0.25);
    }
    button {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    button:active { transform: scale(0.95); }
    button.listening { background: #ef4444; }
    .settings-toggle {
      background: transparent;
      width: auto;
      height: auto;
      border-radius: 0.5rem;
      padding: 0.4rem 0.7rem;
      font-size: 0.8rem;
      color: var(--subtext);
    }
    .settings-panel {
      background: rgba(17,24,39,0.95);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 1rem;
      padding: 1.25rem;
      margin: 1rem;
      display: none;
    }
    .settings-panel.open { display: block; }
    .settings-panel h3 { margin-bottom: 1rem; color: var(--accent); }
    .settings-panel input {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0 1rem;
      background: rgba(30,41,59,0.6);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 0.6rem;
      color: white;
      font-size: 0.95rem;
    }
    .settings-note {
      font-size: 0.8rem;
      color: var(--subtext);
      margin-top: -0.5rem;
      margin-bottom: 1rem;
    }
    .save-btn {
      border-radius: 0.6rem;
      width: 100%;
      height: 44px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">✨ Andromeda</div>
    <div class="status">
      <span class="status-dot"></span>
      <span id="status-text">ONLINE</span>
    </div>
  </header>

  <div class="settings-panel" id="settings-panel">
    <h3>🔐 Provider Settings</h3>
    <label>Groq API Key</label>
    <input type="password" id="groq-key-input" placeholder="gsk_xxxxxxxxxxxx">
    <p class="settings-note">Your key stays in your browser only — never sent to GitHub or any third party.</p>
    <button class="save-btn" id="save-settings">Save & Connect</button>
  </div>

  <main id="chat-container">
    <div class="avatar-container">
      <div class="remy-avatar" id="remy-avatar">👾</div>
    </div>
    <div class="message system" id="welcome-msg">
      Hi! I'm Andromeda — ready to help. 🔮<br><br>
      <button class="settings-toggle" id="open-settings">⚙️ Set API Key</button> to get started.
    </div>
  </main>

  <div class="input-area">
    <button id="mic-btn" title="Voice Input">🎤</button>
    <textarea id="user-input" placeholder="Type your message…"></textarea>
    <button id="send-btn" title="Send">➤</button>
  </div>

  <script src="ai-brain.js" type="module"></script>
  <script src="voice-engine.js" type="module"></script>
</body>
</html>
