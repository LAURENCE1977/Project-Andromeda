<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Andromeda</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: url('bg.webp') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      text-align: center;
    }
    .logo {
      width: 300px;
      max-width: 85%;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.8rem;
      text-shadow: 0 0 15px #4af;
      margin-bottom: 0.8rem;
    }
    .status {
      padding: 0.6rem 2rem;
      border-radius: 50px;
      font-weight: bold;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(8px);
    }
    .status-green { background: rgba(17, 170, 85, 0.7); box-shadow: 0 0 15px #1a5; }
    .status-yellow { background: rgba(204, 153, 0, 0.7); box-shadow: 0 0 15px #ca0; }
    .status-red { background: rgba(170, 34, 34, 0.7); box-shadow: 0 0 15px #a22; }
    .avatar {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 3px solid #4af;
      box-shadow: 0 0 30px #4af, inset 0 0 20px rgba(68,170,255,0.4);
      margin: 1rem 0 2rem;
      object-fit: cover;
    }
    .chat-box {
      width: 100%;
      max-width: 520px;
      background: rgba(0,0,0,0.6);
      border-radius: 24px;
      padding: 1.5rem;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(68,170,255,0.3);
    }
    .messages {
      height: 320px;
      overflow-y: auto;
      margin-bottom: 1rem;
      padding-right: 0.5rem;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #4af; border-radius: 2px; }
    .msg {
      margin: 0.75rem 0;
      padding: 0.9rem 1.2rem;
      border-radius: 20px;
      max-width: 85%;
      line-height: 1.4;
    }
    .user { background: rgba(34, 68, 187, 0.8); margin-left: auto; border-bottom-right-radius: 6px; }
    .andromeda { background: rgba(17, 68, 119, 0.8); margin-right: auto; border-bottom-left-radius: 6px; }
    .input-area { display: flex; gap: 0.6rem; align-items: center; }
    input {
      flex: 1;
      padding: 1rem 1.2rem;
      border-radius: 14px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input::placeholder { color: rgba(255,255,255,0.5); }
    button {
      padding: 1rem 1.4rem;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #25b, #4af);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s;
    }
    button:active { transform: scale(0.97); }
    .mic-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      padding: 0;
      font-size: 1.4rem;
      background: linear-gradient(135deg, #1a7, #4af);
    }
    .mic-btn.listening {
      background: linear-gradient(135deg, #a22, #f54);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 15px rgba(255, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); }
    }
  </style>
</head>
<body>

  <img src="logo-andromeda.webp" alt="Project Andromeda" class="logo">
  <h1>🚀 PROJECT ANDROMEDA</h1>

  <div class="status status-green" id="status">🟢 SYSTEM ONLINE</div>

  <img src="andromeda-avatar.webp" alt="Andromeda" class="avatar" id="avatar">

  <div class="chat-box">
    <div class="messages" id="messages">
      <div class="msg andromeda">Welcome. I am Andromeda. Say my name or type to begin. 💙</div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type or tap the mic to speak...">
      <button class="mic-btn" id="micBtn">🎤</button>
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script src="voice-engine.js"></script>
  <script>
    const messages = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function setStatus(text, color) {
      status.className = `status status-${color}`;
      status.textContent = text;
    }

    sendBtn.onclick = () => {
      const text = userInput.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      userInput.value = '';
      setStatus('🟢 PROCESSING...', 'green');
      setTimeout(() => {
        addMessage("I'm ready. Connecting intelligence modules...", 'andromeda');
        setStatus('🟢 ONLINE — AWAITING', 'green');
      }, 700);
    };

    userInput.addEventListener('keypress', e => e.key === 'Enter' && sendBtn.click());
  </script>
</body>
</html>
