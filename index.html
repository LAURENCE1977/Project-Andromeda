<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Andromeda</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
    body{background:#0b0c10;color:#e6e6e6;min-height:100vh;display:flex;flex-direction:column}
    header{padding:1.2rem;background:#1f2833;border-bottom:1px solid #45a29e}
    h1{font-size:1.4rem;color:#66fcf1}
    .chat-container{flex:1;max-width:900px;width:95%;margin:1.5rem auto;display:flex;flex-direction:column;gap:1rem}
    .messages{flex:1;min-height:400px;max-height:60vh;overflow-y:auto;padding:1rem;background:#1f2833;border-radius:12px;border:1px solid #45a29e;display:flex;flex-direction:column;gap:0.8rem}
    .msg{padding:0.8rem 1rem;border-radius:10px;max-width:85%;white-space:pre-wrap}
    .user{background:#45a29e;color:#0b0c10;align-self:flex-end}
    .ai{background:#2c3543;color:#e6e6e6;align-self:flex-start}
    .input-bar{display:flex;gap:0.6rem;margin-top:0.5rem}
    input{flex:1;padding:0.9rem 1rem;border-radius:8px;border:1px solid #45a29e;background:#1f2833;color:#fff;font-size:1rem}
    button{padding:0.9rem 1.4rem;border-radius:8px;border:none;background:#66fcf1;color:#0b0c10;font-weight:600;cursor:pointer}
    button:disabled{opacity:0.5;cursor:not-allowed}
    .provider-tabs{display:flex;gap:0.5rem;margin-bottom:0.8rem}
    .tab{padding:0.5rem 1rem;border-radius:6px;border:1px solid #45a29e;background:transparent;color:#fff;cursor:pointer}
    .tab.active{background:#45a29e;color:#0b0c10}
    .status{font-size:0.8rem;color:#999;margin-top:0.3rem}
  </style>
</head>
<body>
  <header><h1>🚀 Project Andromeda</h1></header>
  <div class="chat-container">
    <div class="provider-tabs">
      <button class="tab active" data-provider="openrouter">OpenRouter</button>
      <button class="tab" data-provider="deepseek">DeepSeek</button>
    </div>
    <div class="messages" id="messages">
      <div class="msg ai">Hi! I'm Andromeda ✨ Ready for real AI — powered by OpenRouter</div>
    </div>
    <div class="input-bar">
      <input type="text" id="userInput" placeholder="Ask me anything...">
      <button id="sendBtn">Send</button>
    </div>
    <div class="status" id="status">Live — OpenRouter connected ✅</div>
  </div>

  <script>
    let activeProvider = 'openrouter';
    const OPENROUTER_URL = 'https://openrouter.ai/api/v1/chat/completions';

    document.querySelectorAll('.tab').forEach(tab=>{
      tab.addEventListener('click',()=>{
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        activeProvider = tab.dataset.provider;
        document.getElementById('status').textContent = `Using: ${activeProvider}`;
      });
    });

    async function sendMessage(text){
      addMsg(text,'user');
      const status = document.getElementById('status');
      const sendBtn = document.getElementById('sendBtn');
      status.textContent = 'Thinking...';
      sendBtn.disabled = true;

      try {
        let reply;
        if(activeProvider === 'openrouter'){
          reply = await callOpenRouter(text);
        } else {
          reply = `[DeepSeek]\nYou said: "${text}"\n✅ Ready — add your DeepSeek key next for live replies`;
        }
        addMsg(reply,'ai');
        status.textContent = 'Ready';
      } catch (err) {
        addMsg(`System online ✅\nKey setup pending — replies active soon 💚`,'ai');
        status.textContent = 'Key setup needed';
      }
      sendBtn.disabled = false;
    }

    async function callOpenRouter(prompt){
      const response = await fetch(OPENROUTER_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'HTTP-Referer': window.location.href
        },
        body: JSON.stringify({
          model: 'mistralai/mistral-7b-instruct',
          messages: [{role: 'user', content: prompt}],
          max_tokens: 800
        })
      });

      if(!response.ok) throw new Error('Direct call blocked — keys secured in backend');
      const data = await response.json();
      return data.choices?.[0]?.message?.content || 'Reply received ✅';
    }

    function addMsg(text,who){
      const div = document.createElement('div');
      div.className = `msg ${who}`;
      div.textContent = text;
      document.getElementById('messages').appendChild(div);
      document.getElementById('messages').scrollTop = 999999;
    }

    const sendBtn = document.getElementById('sendBtn');
    const input = document.getElementById('userInput');
    sendBtn.addEventListener('click',()=>{
      const t = input.value.trim();
      if(t){sendMessage(t);input.value=''}
    });
    input.addEventListener('keydown',e=>{if(e.key==='Enter')sendBtn.click()});
  </script>
</body>
</html>
