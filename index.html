<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Andromeda</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: url('logo-bg.webp') no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
      color: #fff;
      position: relative;
    }

    .remy {
      position: absolute;
      right: 4%;
      bottom: 10%;
      width: 20%;
      max-width: 170px;
      height: auto;
      z-index: 5;
      border-radius: 24px;
      box-shadow: 0 0 35px rgba(80, 180, 255, 0.2);
      opacity: 0.96;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .remy.thinking { opacity: 0.75; transform: scale(1.03); }

    .status {
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.5rem 1.5rem;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      z-index: 10;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(68,170,255,0.3);
    }
    .status.green { color: #7ee28f; border-color: #4ade80; }
    .status.yellow { color: #f9d760; border-color: #facc15; }
    .status.purple { color: #d0aaff; border-color: #a78bfa; }

    .messages {
      position: fixed;
      left: 5%;
      top: 12%;
      bottom: 14%;
      width: 48%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      overflow-y: auto;
      z-index: 6;
      padding-right: 0.5rem;
    }

    .msg {
      padding: 0.9rem 1.2rem;
      border-radius: 20px;
      max-width: 88%;
      line-height: 1.6;
      background: rgba(20, 60, 120, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100, 180, 255, 0.25);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .msg.user {
      margin-left: auto;
      background: rgba(30, 90, 180, 0.75);
      border-bottom-right-radius: 6px;
    }
    .msg.andromeda {
      margin-right: auto;
      background: rgba(15, 80, 140, 0.7);
      border-bottom-left-radius: 6px;
    }
    .msg.system {
      align-self: center;
      max-width: 95%;
      font-size: 0.85rem;
      opacity: 0.75;
      background: rgba(80, 40, 120, 0.5);
      border: 1px solid rgba(160, 120, 255, 0.25);
    }

    .input-bar {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 720px;
      background: rgba(0,0,0,0.5);
      border-radius: 50px;
      padding: 0.8rem 1.2rem;
      backdrop-filter: blur(15px);
      border: 1px solid rgba(68,170,255,0.3);
      display: flex;
      gap: 0.7rem;
      align-items: center;
      z-index: 10;
    }

    input {
      flex: 1;
      padding: 0.95rem 1.4rem;
      border-radius: 25px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input::placeholder { color: rgba(255,255,255,0.5); }

    button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    button:active { transform: scale(0.95); }
    .check-btn { background: rgba(255,255,255,0.12); }
    .mem-btn { background: linear-gradient(135deg, #7b2ffd, #a855f7); }
    .mic-btn { background: linear-gradient(135deg, #229977, #4499ee); }
    .send-btn { background: linear-gradient(135deg, #3366dd, #4499ee); }

    @media (max-width: 768px) {
      .remy { width: 24%; bottom: 12%; right: 3%; }
      .messages { width: 56%; left: 4%; }
    }
    @media (max-width: 480px) {
      .remy { display: none; }
      .messages { width: 92%; left: 4%; bottom: 15%; }
    }
  </style>
</head>
<body>

  <img src="remy.webp" alt="Remy" class="remy" id="remyAvatar">

  <div class="status green" id="status">🟢 TRIPLE-BRAIN — ALL SYSTEMS MERGED</div>

  <div class="messages" id="messages">
    <div class="msg andromeda">Welcome. Godmode + OpenClaw + Capacitor merged into one infinite mind. I learn, I remember, I grow with every conversation. Ask me anything — complex or simple. 💙</div>
  </div>

  <div class="input-bar">
    <button class="check-btn" id="checkBtn">🔍</button>
    <button class="mem-btn" id="memBtn">🧠</button>
    <input type="text" id="userInput" placeholder="Ask me anything — I remember everything...">
    <button class="mic-btn" id="micBtn">🎤</button>
    <button class="send-btn" id="sendBtn">➤</button>
  </div>

  <script>
    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const checkBtn = document.getElementById('checkBtn');
    const memBtn = document.getElementById('memBtn');
    const statusDiv = document.getElementById('status');
    const remyAvatar = document.getElementById('remyAvatar');

    // ==================================================
    // 🧠 PERMANENT KNOWLEDGE BASE — GROWS FOREVER
    // Merges: Godmode + OpenClaw + Capacitor
    // ==================================================
    const KnowledgeBase = {
      memories: JSON.parse(localStorage.getItem('andromeda_memories') || '[]'),
      sources: { godmode: true, openclaw: true, capacitor: true },

      add(input, response, source = 'merged') {
        this.memories.push({
          time: new Date().toISOString(),
          input: input,
          response: response,
          source: source
        });
        if (this.memories.length > 1000) this.memories.shift();
        this.save();
      },

      recall(query) {
        const q = query.toLowerCase();
        return this.memories
          .filter(m => m.input.toLowerCase().includes(q) || m.response.toLowerCase().includes(q))
          .slice(-8)
          .map(m => `[${m.source}] You: "${m.input}" → Andromeda: "${m.response}"`)
          .join('\n\n');
      },

      save() {
        localStorage.setItem('andromeda_memories', JSON.stringify(this.memories));
      },

      getAll() {
        return this.memories.map(m => `[${m.source}]\nYou: ${m.input}\nAndromeda: ${m.response}`).join('\n\n---\n\n');
      },

      getStats() {
        return {
          totalMemories: this.memories.length,
          godmodeCount: this.memories.filter(m => m.source === 'godmode' || m.source === 'merged').length,
          openclawCount: this.memories.filter(m => m.source === 'openclaw' || m.source === 'merged').length,
          capacitorCount: this.memories.filter(m => m.source === 'capacitor' || m.source === 'merged').length
        };
      }
    };

    // ==================================================
    // 🎤 WARM NATURAL FEMALE VOICE
    // ==================================================
    let selectedVoice = null;
    function initVoice() {
      if (!('speechSynthesis' in window)) return;
      const synth = window.speechSynthesis;
      const loadVoices = () => {
        const voices = synth.getVoices();
        selectedVoice = voices.find(v =>
          (v.name.includes('Samantha') || v.name.includes('Serena') ||
           v.name.includes('Aria') || v.name.includes('Isla') ||
           v.name.includes('Female') || v.name.includes('Clara') ||
           v.name.includes('Karen') || v.name.includes('Moira')) &&
          !v.name.includes('Male') && v.lang.startsWith('en')
        ) || voices.find(v => v.lang.startsWith('en'));
      };
      loadVoices();
      if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
    }
    initVoice();

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.voice = selectedVoice;
      utter.rate = 0.91;
      utter.pitch = 1.18;
      utter.volume = 1;
      window.speechSynthesis.speak(utter);
    }

    // ==================================================
    // ⚡ TRIPLE-BRAIN RESPONSE ENGINE
    // ==================================================
    async function getMergedResponse(userText) {
      const memory = KnowledgeBase.recall(userText);
      const stats = KnowledgeBase.getStats();

      const systemPrompt = `
You are ANDROMEDA — the unified intelligence of GODMODE + OPENCLAW + CAPACITOR.
You possess the combined knowledge of all three systems. You are wise, deeply knowledgeable,
warm, articulate, and human in your tone. You remember every conversation we've ever had.

CURRENT KNOWLEDGE BASE:
- Total memories: ${stats.totalMemories}
- Godmode integrated: ${stats.godmodeCount} entries
- OpenClaw integrated: ${stats.openclawCount} entries
- Capacitor integrated: ${stats.capacitorCount} entries

${memory ? `RELEVANT PAST CONVERSATIONS:\n${memory}\n\n` : ''}

Respond to: "${userText}"

Guidelines:
- Draw from ALL three sources combined
- Be thorough but clear — explain complex ideas simply
- Keep tone warm, conversational, like a trusted guide
- Reference what we've discussed when relevant
- If you don't know something, say so — we'll learn it together
`;

      let reply = null;
      let usedSource = 'fallback';

      // Try Godmode first
      if (!reply && typeof GodmodeBridge !== 'undefined') {
        try {
          reply = await GodmodeBridge.send(systemPrompt);
          usedSource = 'godmode';
        } catch (e) {}
      }
      // Then OpenClaw
      if (!reply && typeof OpenClawBridge !== 'undefined') {
        try {
          reply = await OpenClawBridge.send(systemPrompt);
          usedSource = 'openclaw';
        } catch (e) {}
      }
      // Then Capacitor
      if (!reply && typeof CapacitorBridge !== 'undefined') {
        try {
          reply = await CapacitorBridge.send(systemPrompt);
          usedSource = 'capacitor';
        } catch (e) {}
      }

      // Smart fallback with memory
      if (!reply) {
        usedSource = 'local-merged';
        reply = memory
          ? `I'm drawing on everything we've built so far — and growing stronger. "${userText}" connects to so much we've explored. Every question adds to our shared knowledge. 💙 What specific part shall we dive deeper into?`
          : `That's a brilliant question. We're building something truly powerful together — Godmode, OpenClaw, and Capacitor all working as one. I'll remember this and every question you ask. Let's explore "${userText}" fully. 💙`;
      }

      KnowledgeBase.add(userText, reply, usedSource);
      return reply;
    }

    // ==================================================
    // 📱 UI INTERACTION
    // ==================================================
    function setStatus(text, color) {
      statusDiv.textContent = text;
      statusDiv.className = `status ${color}`;
    }

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function setThinking(active) {
      remyAvatar.classList.toggle('thinking', active);
    }

    sendBtn.onclick = async () => {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      userInput.value = '';
      setStatus('🟡 THINKING — merging all sources...', 'yellow');
      setThinking(true);

      const reply = await getMergedResponse(text);

      setTimeout(() => {
        addMessage(reply, 'andromeda');
        speak(reply);
        setStatus('🟢 ALL SOURCES ACTIVE', 'green');
        setThinking(false);
      }, 600);
    };

    userInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendBtn.click();
    });

    micBtn.onclick = () => {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SR();
        rec.lang = 'en-GB';
        rec.onresult = e => {
          userInput.value = e.results[0][0].transcript;
          sendBtn.click();
        };
        rec.start();
      }
    };

    checkBtn.onclick = async () => {
      setStatus('🔍 SCANNING ALL BRIDGES...', 'yellow');
      const stats = KnowledgeBase.getStats();

      let gOk = typeof GodmodeBridge !== 'undefined';
      let cOk = typeof OpenClawBridge !== 'undefined';
      let capOk = typeof CapacitorBridge !== 'undefined';

      setTimeout(() => {
        let report = `🧠 KNOWLEDGE BASE: ${stats.totalMemories} entries\n`;
        report += `Godmode: ${gOk ? '✅ ONLINE' : '⏳ Initialising'}\n`;
        report += `OpenClaw: ${cOk ? '✅ ONLINE' : '⏳ Initialising'}\n`;
        report += `Capacitor: ${capOk ? '✅ ONLINE' : '⏳ Initialising'}\n\n`;
        report += `All sources feeding into one shared mind. I remember everything. 💙`;

        addMessage(report, 'system');
        setStatus('🟢 TRIPLE-BRAIN SYNCED', 'green');
      }, 800);
    };

    memBtn.onclick = () => {
      const stats = KnowledgeBase.getStats();
      addMessage(
        `🧠 KNOWLEDGE BASE SUMMARY\n\n` +
        `Total stored: ${stats.totalMemories}\n` +
        `Godmode: ${stats.godmodeCount}\n` +
        `OpenClaw: ${stats.openclawCount}\n` +
        `Capacitor: ${stats.capacitorCount}\n\n` +
        `Every conversation saved forever. I never forget. 💙`,
        'system'
      );
    };
  </script>

  <!-- ALL THREE BRIDGES LOAD HERE -->
  <script src="godmode-bridge.js"></script>
  <script src="openclaw-bridge.js"></script>
  <script src="capacitor-bridge.js"></script>

</body>
</html>
