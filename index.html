<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Andromeda</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: url('bg.webp') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      padding-bottom: 90px;
    }

    /* Logo — Top Centre */
    .logo {
      width: 220px;
      max-width: 65%;
      margin: 0 auto 0.5rem;
      display: block;
    }

    /* Status — Small top indicator */
    .status {
      padding: 0.5rem 1.2rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 1rem;
      text-align: center;
      background: rgba(17, 170, 85, 0.65);
      box-shadow: 0 0 12px #1a5;
    }

    /* Messages — Small bubbles above input */
    .messages {
      width: 100%;
      max-width: 750px;
      flex: 1;
      overflow-y: auto;
      margin-bottom: 0.5rem;
      padding-right: 0.5rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .messages::-webkit-scrollbar {
      width: 3px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #4af;
      border-radius: 2px;
    }

    .msg {
      margin: 0.4rem 0;
      padding: 0.7rem 1rem;
      border-radius: 18px;
      max-width: 75%;
      line-height: 1.4;
      font-size: 0.95rem;
    }

    .user {
      background: rgba(34, 68, 187, 0.85);
      margin-left: auto;
      border-bottom-right-radius: 6px;
    }

    .andromeda {
      background: rgba(17, 68, 119, 0.85);
      margin-right: auto;
      border-bottom-left-radius: 6px;
    }

    /* Bottom Input Bar — Slim, like an address bar */
    .input-bar {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 2rem);
      max-width: 750px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 50px;
      padding: 0.6rem 0.8rem;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(68, 170, 255, 0.35);
      display: flex;
      gap: 0.5rem;
      align-items: center;
      z-index: 10;
    }

    input {
      flex: 1;
      padding: 0.8rem 1rem;
      border-radius: 25px;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #25b, #4af);
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    button:active {
      transform: scale(0.97);
    }

    .mic-btn {
      background: linear-gradient(135deg, #1a7, #4af);
    }

    .mic-btn.listening {
      background: linear-gradient(135deg, #a22, #f54);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.5);
      }
      70% {
        box-shadow: 0 0 0 12px rgba(255, 68, 68, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(255, 68, 68, 0);
      }
    }

    .send-btn {
      background: linear-gradient(135deg, #25b, #4af);
    }

    /* Small system check button inside bar */
    .check-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      font-size: 1.1rem;
    }

    /* Prevent bottom bar overlap */
    @media (max-width: 520px) {
      .input-bar {
        padding: 0.5rem 0.6rem;
      }

      input {
        font-size: 0.95rem;
      }

      button {
        width: 44px;
        height: 44px;
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <img src="logo-andromeda.webp" alt="Project Andromeda" class="logo">

  <!-- Status -->
  <div class="status" id="status">🟢 ONLINE — Tap 🎤 to speak</div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="msg andromeda">Welcome. I am Andromeda. Tap the microphone or type to begin. 💙</div>
  </div>

  <!-- Bottom Input Bar -->
  <div class="input-bar">
    <button class="check-btn" id="checkBtn">🔍</button>
    <input type="text" id="userInput" placeholder="Type or tap the mic to speak...">
    <button class="mic-btn" id="micBtn">🎤</button>
    <button class="send-btn" id="sendBtn">➤</button>
  </div>

  <script src="voice-engine.js"></script>
  <script>
    const messages = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');
    const checkBtn = document.getElementById('checkBtn');

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function setStatus(text, color) {
      status.className = `status status-${color}`;
      status.textContent = text;
    }

    sendBtn.onclick = () => {
      const text = userInput.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      userInput.value = '';
      setStatus('🟡 PROCESSING...', 'yellow');
      setTimeout(() => {
        addMessage("I hear you. Connecting intelligence modules...", 'andromeda');
        setStatus('🟢 ONLINE', 'green');
      }, 700);
    };

    userInput.addEventListener('keypress', e => e.key === 'Enter' && sendBtn.click());

    checkBtn.onclick = () => {
      setStatus('🟡 RUNNING DIAGNOSTICS...', 'yellow');
      setTimeout(() => {
        addMessage("✅ SYSTEM CHECK COMPLETE", 'andromeda');
        addMessage("• Background: ✅ Loaded\n• Logo: ✅ Loaded\n• Voice Engine: ✅ Active\n• Interface: ✅ Responsive\n• Status: ALL SYSTEMS NOMINAL 💙", 'andromeda');
        setStatus('🟢 ALL SYSTEMS GO', 'green');
      }, 1000);
    };
  </script>
</body>
</html>
