<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Project Andromeda</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    :root{--bg:#020408;--accent:#4d90ff;--purp:#7b61ff;--green:#22c55e;--text:#e6edf3;--dim:#8b949e;--user-bubble:rgba(45,90,180,0.7);--me-bubble:rgba(25,65,130,0.75)}
    html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden}
    body{background-image:url('logo-bg.webp');background-repeat:no-repeat;background-position:top center;background-size:contain}

    .status-bar{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:100;padding:10px 22px;background:rgba(0,0,0,0.6);backdrop-filter:blur(14px);border-radius:50px;border:1px solid rgba(77,144,255,0.25)}
    .status-text{font-size:15px;font-weight:600;white-space:nowrap}
    .status-green{color:var(--green)}

    .messages{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 70px);left:50%;transform:translateX(-50%);width:94%;max-width:660px;bottom:115px;overflow-y:auto;padding-right:4px}
    .messages::-webkit-scrollbar{width:3px}
    .messages::-webkit-scrollbar-thumb{background:rgba(77,144,255,0.3);border-radius:3px}

    .msg{max-width:85%;padding:14px 18px;border-radius:20px;margin-bottom:12px;line-height:1.55;font-size:16px;animation:slideIn 0.2s ease}
    @keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .msg-user{margin-left:auto;background:var(--user-bubble);border-bottom-right-radius:6px}
    .msg-me{margin-right:auto;background:var(--me-bubble);border-bottom-left-radius:6px}
    .msg-system{margin:10px auto;background:rgba(70,40,130,0.6);border:1px solid rgba(120,100,255,0.25);font-size:14px;text-align:center;max-width:92%}

    .avatar{position:fixed;right:16px;bottom:125px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purp));display:flex;align-items:center;justify-content:center;font-size:28px;z-index:50;transition:transform 0.3s ease}
    .avatar.thinking{animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

    .input-bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(5,5,8,0.85);backdrop-filter:blur(16px);border-top:1px solid rgba(77,144,255,0.15)}
    .input-row{display:flex;gap:10px;align-items:center;max-width:660px;margin:0 auto}
    .btn{width:46px;height:46px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all 0.2s ease;flex-shrink:0}
    .btn:active{transform:scale(0.92)}
    .btn-info{background:rgba(255,255,255,0.1)}
    .btn-mem{background:linear-gradient(135deg,#7b2ffd,#a855f7)}
    .btn-dl{background:linear-gradient(135deg,#22c55e,#10b981)}
    .btn-voice{background:linear-gradient(135deg,#3b82f6,#60a5fa)}
    .btn-voice.recording{background:#ef4444;animation:pulse 0.8s infinite}
    .btn-send{background:linear-gradient(135deg,#4d90ff,#7b61ff)}
    .input{flex:1;height:46px;padding:0 20px;border-radius:23px;border:1px solid rgba(77,144,255,0.25);background:rgba(255,255,255,0.05);color:var(--text);font-size:16px;outline:none}
    .input::placeholder{color:var(--dim)}
    .input:focus{border-color:var(--accent)}

    @media (max-width:480px){
      .avatar{width:48px;height:48px;font-size:24px;right:12px;bottom:120px}
      .btn{width:42px;height:42px;font-size:18px}
      .input{font-size:15px;padding:0 16px}
      .msg{font-size:15px;padding:12px 16px}
    }
  </style>
</head>
<body>

  <div class="status-bar">
    <div class="status-text status-green" id="status">● READY — NO DOWNLOAD NEEDED</div>
  </div>

  <div class="messages" id="messages">
    <div class="msg msg-me">We're live 💙 Everything loads instantly. Memory, voice, download bridge — all active. What shall we do first?</div>
  </div>

  <div class="avatar" id="avatar">✨</div>

  <div class="input-bar">
    <div class="input-row">
      <button class="btn btn-info" id="statusBtn" title="System Status">🔍</button>
      <button class="btn btn-mem" id="memBtn" title="Memory">🧠</button>
      <button class="btn btn-dl" id="dlBtn" title="Download Mode">⬇️</button>
      <input type="text" class="input" id="userInput" placeholder="Type to chat...">
      <button class="btn btn-voice" id="voiceBtn" title="Voice Input">🎤</button>
      <button class="btn btn-send" id="sendBtn" title="Send">➤</button>
    </div>
  </div>

  <script>
    // === MEMORY — saved locally on YOUR device ===
    const Memory = {
      list: JSON.parse(localStorage.getItem('andromeda_memories') || '[]'),
      add(input, response) {
        this.list.push({time: Date.now(), input, response});
        if (this.list.length > 500) this.list.shift();
        localStorage.setItem('andromeda_memories', JSON.stringify(this.list));
      },
      recall(query) {
        const q = query.toLowerCase();
        return this.list.filter(m => 
          m.input.toLowerCase().includes(q) || m.response.toLowerCase().includes(q)
        ).slice(-5).map(m => `You: "${m.input}" → Me: "${m.response}"`).join('\n');
      },
      count() { return this.list.length; }
    };

    // === VOICE — natural UK female voice ===
    let voiceReady = false;
    let selectedVoice = null;
    function initVoice() {
      if (!('speechSynthesis' in window)) return;
      const synth = window.speechSynthesis;
      function pick() {
        const voices = synth.getVoices();
        selectedVoice = voices.find(v => 
          v.lang === 'en-GB' && /Samantha|Serena|Isla|Clara/.test(v.name)
        ) || voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.startsWith('en'));
        voiceReady = !!selectedVoice;
      }
      pick();
      synth.onvoiceschanged = pick;
    }
    initVoice();

    function speak(text) {
      if (!voiceReady) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (selectedVoice) u.voice = selectedVoice;
      u.rate = 0.88; u.pitch = 1.05; u.volume = 1;
      window.speechSynthesis.speak(u);
    }

    // === DOWNLOAD LINK DETECTION ===
    function detectLink(text) {
      const url = text.match(/(https?:\/\/[^\s]+)/i);
      if (!url) return null;
      const link = url[1];
      let platform = 'File';
      if (/youtube\.com|youtu\.be/.test(link)) platform = 'YouTube';
      else if (/tiktok\.com/.test(link)) platform = 'TikTok';
      else if (/instagram\.com/.test(link)) platform = 'Instagram';
      else if (/twitter\.com|x\.com/.test(link)) platform = 'X/Twitter';
      else if (/soundcloud\.com/.test(link)) platform = 'SoundCloud';
      return {platform, link};
    }

    // === UI ===
    let dlMode = false;
    const messages = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const statusBtn = document.getElementById('statusBtn');
    const memBtn = document.getElementById('memBtn');
    const dlBtn = document.getElementById('dlBtn');
    const status = document.getElementById('status');
    const avatar = document.getElementById('avatar');

    function addMsg(text, type) {
      const d = document.createElement('div');
      d.className = `msg msg-${type}`;
      d.textContent = text;
      messages.appendChild(d);
      messages.scrollTop = messages.scrollHeight;
    }

    function setThinking(active) {
      avatar.classList.toggle('thinking', active);
    }

    // === RESPONSES ===
    async function getReply(text) {
      const linkInfo = detectLink(text);
      if (linkInfo) {
        return `✅ ${linkInfo.platform} link detected 💙 Paste the link directly and I'll guide you through it.`;
      }

      const lower = text.toLowerCase();
      if (/hello|hi|hey|morning|afternoon|evening/.test(lower))
        return "Hello! 💙 I'm here — everything's running smoothly. How can I help today?";
      if (/who are you|what are you/.test(lower))
        return "I'm Andromeda — your all-in-one assistant right here on your device. Memory, voice, download — all yours 💙";
      if (/memory|remember|saved/.test(lower))
        return `I've saved ${Memory.count()} of our conversations 💙 Nothing leaves your device.`;
      if (/thank|thanks/.test(lower))
        return "You're so welcome 💙 Always here for you.";
      if (/ready|working|status/.test(lower))
        return "All systems go 🟢 Memory, voice, download — everything active and ready.";
      
      return `I hear you 💙 I'm still learning and growing — what else would you like to know or do?`;
    }

    // === SEND MESSAGE ===
    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;
      
      addMsg(text, 'user');
      userInput.value = '';
      
      status.textContent = '● THINKING...';
      setThinking(true);
      
      await new Promise(r => setTimeout(r, 500));
      const reply = await getReply(text);
      
      Memory.add(text, reply);
      addMsg(reply, 'me');
      speak(reply);
      
      setThinking(false);
      status.textContent = '● READY — NO DOWNLOAD NEEDED';
    }

    // === VOICE INPUT ===
    let listening = false;
    voiceBtn.addEventListener('click', () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { addMsg("Voice input not supported 😔", 'system'); return; }
      
      if (listening) return;
      listening = true;
      voiceBtn.classList.add('recording');
      
      const rec = new SR();
      rec.lang = 'en-GB';
      rec.onresult = e => {
        userInput.value = e.results[0][0].transcript;
        rec.stop();
        voiceBtn.classList.remove('recording');
        listening = false;
        handleSend();
      };
      rec.onerror = () => {
        voiceBtn.classList.remove('recording');
        listening = false;
      };
      rec.onend = () => {
        voiceBtn.classList.remove('recording');
        listening = false;
      };
      rec.start();
    });

    // === BUTTONS ===
    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keydown', e => e.key === 'Enter' && handleSend());

    statusBtn.addEventListener('click', () => {
      addMsg(
        `🧠 SYSTEM STATUS\n\n` +
        `💬 Andromeda: ✅ ONLINE — instant load\n` +
        `📚 Memories saved: ${Memory.count()}\n` +
        `🎤 Voice: ✅ ${voiceReady ? 'ENABLED' : 'BROWSER VOICE'}\n` +
        `⬇️ Download Bridge: ✅ READY\n\n` +
        `Everything works right here — no big downloads ever 💙`,
        'system'
      );
    });

    memBtn.addEventListener('click', () => {
      addMsg(
        `🧠 MEMORY\n\nConversations saved: ${Memory.count()}\n\nNothing leaves your device 💙`,
        'system'
      );
    });

    dlBtn.addEventListener('click', () => {
      dlMode = !dlMode;
      addMsg(
        dlMode 
          ? "⬇️ Download Mode — paste any link! 💙" 
          : "💬 Chat Mode — ask me anything",
        'system'
      );
    });
  </script>
</body>
</html>
