<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Andromeda</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      min-height: 100vh;
      overflow: hidden;
      background: url('logo-bg.webp') no-repeat center center;
      background-size: cover;
      color: #fff;
    }
    .remy {
      position: fixed;
      right: 5%;
      bottom: 12%;
      width: 38%;
      max-width: 280px;
      height: auto;
      pointer-events: none;
      filter: drop-shadow(0 0 18px rgba(68, 170, 255, 0.35));
    }
    .status {
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.45rem 1.2rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: bold;
      z-index: 10;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(12px);
    }
    .status.green { color: #4ade80; border: 1px solid #4ade80; }
    .status.yellow { color: #facc15; border: 1px solid #facc15; }
    .messages {
      position: fixed;
      left: 1.5rem;
      bottom: 5.5rem;
      width: calc(100% - 3rem);
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 5;
    }
    .msg {
      padding: 0.75rem 1rem;
      border-radius: 18px;
      max-width: 85%;
      line-height: 1.45;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(68,170,255,0.35);
    }
    .msg.user {
      margin-left: auto;
      background: rgba(34, 68, 187, 0.85);
      border-bottom-right-radius: 6px;
    }
    .msg.andromeda {
      margin-right: auto;
      background: rgba(17, 68, 119, 0.85);
      border-bottom-left-radius: 6px;
    }
    .input-bar {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 2rem);
      max-width: 760px;
      background: rgba(0,0,0,0.65);
      border-radius: 50px;
      padding: 0.6rem 0.8rem;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(68,170,255,0.35);
      display: flex;
      gap: 0.5rem;
      align-items: center;
      z-index: 10;
    }
    input {
      flex: 1;
      padding: 0.8rem 1rem;
      border-radius: 25px;
      border: none;
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input::placeholder { color: rgba(255,255,255,0.55); }
    button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    button:active { transform: scale(0.97); }
    .check-btn { background: rgba(255,255,255,0.15); font-size: 1.1rem; }
    .mic-btn { background: linear-gradient(135deg, #1a7, #4af); }
    .send-btn { background: linear-gradient(135deg, #25b, #4af); }
    @media (max-width: 520px) {
      .remy { width: 48%; right: 3%; bottom: 11%; }
      .messages { left: 1rem; bottom: 5.5rem; width: calc(100% - 2rem); }
      .input-bar { padding: 0.5rem 0.6rem; }
      input { font-size: 0.95rem; }
      button { width: 44px; height: 44px; font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <img src="logo-bg.webp" alt="Project Andromeda" class="logo-bg">
  <img src="remy.webp" alt="Remy" class="remy">

  <div class="status green" id="status">🟢 ONLINE</div>

  <div class="messages" id="messages">
    <div class="msg andromeda">Welcome to Project Andromeda. All systems are ready. 💙</div>
  </div>

  <div class="input-bar">
    <button class="check-btn" id="checkBtn">🔍</button>
    <input type="text" id="userInput" placeholder="Type or speak your message...">
    <button class="mic-btn" id="micBtn">🎤</button>
    <button class="send-btn" id="sendBtn">➤</button>
  </div>

  <script>
    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const checkBtn = document.getElementById('checkBtn');
    const statusDiv = document.getElementById('status');

    function setStatus(text, color) {
      statusDiv.textContent = text;
      statusDiv.className = `status ${color}`;
    }

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    sendBtn.onclick = async () => {
      const text = userInput.value.trim();
      if (!text) return;
      
      addMessage(text, 'user');
      userInput.value = '';
      setStatus('🟡 CONNECTING...', 'yellow');
      
      let reply;
      if (typeof GodmodeBridge !== 'undefined') {
        reply = await GodmodeBridge.send(text);
      } else if (typeof OpenClawBridge !== 'undefined') {
        reply = await OpenClawBridge.send(text);
      } else {
        reply = "All systems initialising — please try again shortly 💙";
      }
      
      setTimeout(() => {
        addMessage(reply, 'andromeda');
        if (typeof AndromedaVoice !== 'undefined' && AndromedaVoice.speak) {
          AndromedaVoice.speak(reply);
        }
        setStatus('🟢 ONLINE', 'green');
      }, 600);
    };

    userInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendBtn.click();
    });

    micBtn.onclick = () => {
      if (typeof AndromedaVoice !== 'undefined' && AndromedaVoice.startListening) {
        AndromedaVoice.startListening();
      } else {
        userInput.placeholder = "Voice loading...";
        setTimeout(() => {
          userInput.placeholder = "Type or speak your message...";
        }, 2000);
      }
    };

    checkBtn.onclick = async () => {
      setStatus('🔍 CHECKING BRIDGES...', 'yellow');
      let gOk = typeof GodmodeBridge !== 'undefined' && await GodmodeBridge.checkConnection();
      let cOk = typeof OpenClawBridge !== 'undefined' && await OpenClawBridge.checkConnection();
      
      setTimeout(() => {
        if (gOk && cOk) {
          setStatus('🟢 ALL BRIDGES ACTIVE', 'green');
          addMessage("✅ Godmode + OpenClaw — both connected!", 'andromeda');
        } else if (gOk) {
          setStatus('🟢 GODMODE ACTIVE', 'green');
          addMessage("✅ Godmode bridge connected — OpenClaw standby", 'andromeda');
        } else if (cOk) {
          setStatus('🟢 OPENCLAW ACTIVE', 'green');
          addMessage("✅ OpenClaw bridge connected — Godmode syncing", 'andromeda');
        } else {
          setStatus('🟡 BRIDGES SYNCING', 'yellow');
          addMessage("⏳ Bridges are setting up — try again in 1–2 minutes", 'andromeda');
        }
      }, 800);
    };
  </script>

  <script src="openclaw-bridge.js"></script>
  <script src="godmode-bridge.js"></script>
  <script src="voice-engine.js"></script>

</body>
</html>
